<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple text message</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }
        .container {
            background-color: white;
            border: solid 2px black;
            width: 60%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
        }
        textarea {
            border: none;
            font-size: 18px;
            width: 100%;
            height: 150px;
            resize: none;
            outline: none;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 16px;
            color: #555;
        }
        .warning {
            color: red;
            font-weight: bold;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <h1>Simple text message</h1>
    
    <div class="container">
        <textarea id="textMessage" placeholder="Type your message here..."></textarea>
        
        <div class="info-row">
            <span id="counter">0 / 200 characters</span>
            <span id="warningMessage" class="warning">Character limit reached!</span>
        </div>
    </div>

    <script>
        var textarea = document.getElementById("textMessage");
        var counter = document.getElementById("counter");
        var warningMessage = document.getElementById("warningMessage");
        var MAX_CHARS = 200;
        textarea.addEventListener("input", function() {
            var currentText = textarea.value;
            if (currentText.length > MAX_CHARS) {
                textarea.value = currentText.substring(0, MAX_CHARS);
                warningMessage.style.visibility = "visible";
            } else {
                warningMessage.style.visibility = "hidden";
            }
            counter.textContent = `${textarea.value.length} / ${MAX_CHARS} characters`;
        });
    </script>
</body>
</html>
